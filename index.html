<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf4">
  <title>秋のイベントガイド2026</title>
    <style>
    :root{
      --paper:#fffdf8;
      --ink:#2d211b;
      --muted:#826e62;
      --fortune:#d52f24;
      --fortune-soft:#f9e7e4;
      --fortune-soft-2:#fdf4f2;
      --fortune-border:#e6a39d;
      --red:var(--fortune);
      --line:#ead8d4;
      --stage-h:690px;
      --control-gap:12px;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
      background:#f4f1ed;
      color:var(--ink);
      font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
    }

    body{
      padding:20px 14px 32px;
    }

    button, a{ font:inherit; }

    .app{
      width:min(100%, 540px);
      margin:0 auto;
      background:#fff;
      box-shadow:0 12px 32px rgba(0,0,0,.08);
    }

    .header{
      padding:12px 18px 10px;
      text-align:center;
    }

    .eyebrow{
      margin:0 0 2px;
      font-size:10px;
      font-weight:700;
      line-height:1.4;
    }

    h1{
      margin:0;
      font-family:"Kaisei Opti", serif;
      font-size:clamp(30px, 8vw, 42px);
      line-height:1.25;
      font-weight:700;
      letter-spacing:.04em;
    }

    .lead{
      margin:8px 0 0;
      font-size:11px;
      line-height:1.4;
    }

    .panel{
      padding:0 22px 26px;
    }

    /* 見た目部分はこのステージの高さを固定して、ボタン位置を安定させる */
    .fortune-stage{
      position:relative;
      width:100%;
      height:var(--stage-h);
      overflow:hidden;
      background:linear-gradient(180deg, #fff 0%, #fffaf2 100%);
      border-top:1px solid #f7ede1;
      border-bottom:1px solid #f4dfc5;
    }

    .stage-question{
      position:absolute;
      top:140px;
      left:0;
      width:100%;
      margin:0;
      text-align:center;
      font-size:18px;
      font-weight:700;
      line-height:1.6;
      transition:opacity .25s ease;
    }

    /* 箱は後で画像差し替え予定。
       サイズ・位置・角度・アニメーションはCSS側だけで管理する。 */
    .box-wrap{
      position:absolute;
      left:50%;
      top:185px;
      width:min(54vw, 230px);
      transform:translateX(-50%) rotate(27deg);
      transform-origin:center;
      z-index:2;
      transition:opacity .25s ease;
    }

    .omikuji-box-image{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
      filter:drop-shadow(0 18px 16px rgba(83,55,24,.18));
    }

    .box-wrap{
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .box-wrap:focus-visible{
      outline:3px solid rgba(213,47,36,.35);
      outline-offset:8px;
      border-radius:18px;
    }

    .box-wrap:not(.shaking):active{
      filter:brightness(.97);
    }

    .box-wrap.shaking{
      animation:shakeVertical .42s ease-in-out 4;
      cursor:default;
    }

    @keyframes shakeVertical{
      0%,100%{ transform:translateX(-50%) rotate(27deg) translateY(0); }
      25%{ transform:translateX(-50%) rotate(27deg) translateY(-14px); }
      50%{ transform:translateX(-50%) rotate(27deg) translateY(12px); }
      75%{ transform:translateX(-50%) rotate(27deg) translateY(-9px); }
    }

    .omikuji-stick{
      position:absolute;
      left:50%;
      top:365px;
      width:13px;
      height:168px;
      border-radius:999px;
      background:linear-gradient(180deg, #fff7e8, #e8c98f);
      box-shadow:0 6px 12px rgba(83,55,24,.15);
      transform:translateX(-50%) translateY(70px);
      opacity:0;
      z-index:1;
    }

    .omikuji-stick.show{
      animation:stickOut .48s ease-out forwards;
    }

    @keyframes stickOut{
      from{ opacity:0; transform:translateX(-50%) translateY(70px); }
      to{ opacity:1; transform:translateX(-50%) translateY(0); }
    }

    /* 秋の背景あしらい：中央のおみくじを邪魔しないよう上下左右に配置 */
    .autumn-deco{
      position:absolute;
      left:0;
      width:100%;
      height:auto;
      max-width:none;
      pointer-events:none;
      user-select:none;
      z-index:0;
    }

    .autumn-deco-top{
      top:0;
    }

    .autumn-deco-bottom{
      bottom:0;
    }

    .result-paper{
      position:absolute;
      left:50%;
      top:28px;
      width:min(82%, 310px);
      min-height:625px;
      padding:24px 18px 22px;
      transform:translateX(-50%) scale(.92);
      opacity:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 18% 10%, rgba(223,45,32,.05), transparent 18%),
        linear-gradient(180deg, #fffdf8, #fbf2df);
      border:2px solid #ead0a5;
      box-shadow:0 10px 24px rgba(88,55,22,.14);
      z-index:4;
      overflow:hidden;
    }

    .result-paper::before{
      content:"";
      position:absolute;
      inset:9px;
      border:4px solid var(--red);
      pointer-events:none;
    }

    .result-paper.show{
      animation:paperReveal .48s ease-out forwards;
      pointer-events:auto;
    }

    @keyframes paperReveal{
      from{ opacity:0; transform:translateX(-50%) scale(.92); }
      to{ opacity:1; transform:translateX(-50%) scale(1); }
    }
    .paper-kicker{
      width:auto;
      margin:8px auto 3px;
      padding:0;
      border-radius:0;
      color:var(--red);
      background:transparent;
      text-align:center;
      font-size:12px;
      font-weight:900;
      letter-spacing:.16em;
    }

    /* 運勢そのものは主役ではないので少し小さくする */
    .paper-title{
      margin:0;
      text-align:center;
      color:var(--red);
      font-size:clamp(46px, 12vw, 64px);
      line-height:1.05;
      font-weight:900;
      letter-spacing:.06em;
    }

    /* おみくじ結果の説明を一番上に置く */
    .paper-fortune-message{
      max-width:15em;
      margin:0 auto 4px;
      padding:0;
      border:0;
      text-align:center;
      font-size:17px;
      line-height:1.7;
      font-weight:700;
      color:#4e4038;
    }

    .paper-divider{
      height:3px;
      margin:16px 0 13px;
      background:linear-gradient(90deg, transparent, var(--red) 10%, var(--red) 90%, transparent);
    }
    .paper-facility-head{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin:0 auto 3px;
    }

    .paper-badge{
      width:auto;
      margin:0;
      padding:0;
      border-radius:0;
      color:var(--red);
      background:transparent;
      font-size:16px;
      font-weight:900;
      letter-spacing:.04em;
    }
    /* このページで最も伝えたい情報なので施設名を強く見せる */
    .paper-spot-name{
      margin:18px auto 22px;
      width:10em;
      min-width:10em;
      max-width:10em;
      min-height:3.4em;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:var(--fortune);
      font-size:24px;
      line-height:1.5;
      font-weight:900;
      white-space:nowrap;
      overflow:visible;
      position:relative;
      z-index:1;
    }

    .paper-spot-name br{
      display:block;
    }
    .paper-spot-message {
      margin: 0 auto 24px;
      width: 10em;
      min-width: 10em;
      max-width: 10em;
      min-height: 3.2em;
      padding: 0;

      text-align: center;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.65;
      font-weight: 700;

      /* <br>による改行を有効にする */
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .paper-spot-message br{
      display:block;
    }
    .paper-map-number{
      display:inline-block;
      margin:0;
      padding:0;
      color:var(--red);
      background:transparent;
      border:0;
      border-radius:0;
      box-shadow:none;
      text-decoration:none;
      text-align:center;
      font-size:12px;
      line-height:1.2;
      font-weight:900;
      letter-spacing:.04em;
      cursor:pointer;
    }

    .paper-map-number:hover,
    .paper-map-number:focus-visible{
      text-decoration:underline;
      text-underline-offset:3px;
    }

    .fortune-stage.is-result .stage-question,
    .fortune-stage.is-result .box-wrap,
    .fortune-stage.is-result .omikuji-stick{
      opacity:0;
    }


    /* 施設リンクは結果のおみくじ紙の中、施設名の直下に配置する */
    .paper-links{
      position:relative;
      z-index:6;
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      width:88%;
      margin:8px auto 0;
      padding:0;
    }
    .paper-link{
      position:relative;
      z-index:7;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:34px;
      padding:6px 8px;
      border-radius:999px;
      border:1px solid var(--fortune-border);
      text-decoration:none;
      font-size:11px;
      font-weight:900;
      line-height:1.2;
      transition:transform .15s ease, opacity .15s ease;
    }

    .paper-link.website{
      color:#fff;
      border-color:var(--fortune);
      background:var(--fortune);
    }

    .paper-link.map{
      color:var(--fortune);
      border-color:var(--fortune-border);
      background:var(--fortune-soft);
    }

    .paper-link:active{ transform:scale(.985); }
    .paper-link.is-disabled{ opacity:.4; pointer-events:none; }



    .paper-again-btn{
      position:relative;
      z-index:7;
      display:flex;
      align-items:center;
      justify-content:center;
      width:88%;
      min-height:40px;
      margin:10px auto 0;
      padding:8px 12px;
      border:1.5px solid var(--fortune-border);
      border-radius:999px;
      color:var(--fortune);
      background:var(--fortune-soft-2);
      font:inherit;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
    }

    .paper-again-btn:active{
      transform:scale(.985);
    }

    .paper-again-btn:disabled{
      opacity:.5;
      cursor:default;
    }

    .footer{
      margin-top:20px;
      padding:18px 20px 24px;
      border-top:1px solid var(--line);
      text-align:center;
      color:var(--muted);
      font-size:11px;
      line-height:1.7;
    }

    .confetti{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:8;
    }

    .piece{
      position:absolute;
      width:10px;
      height:14px;
      opacity:0;
      border-radius:3px;
    }

    .piece.play{ animation:burst 1s ease-out forwards; }

    @keyframes burst{
      0%{ opacity:1; transform:translate(0,0) rotate(0deg); }
      100%{ opacity:0; transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); }
    }

   @media (max-width:420px){
      :root{
        --stage-h:580px;
      }

      body{
        padding:0;
      }

      .app{
        width:100%;
        box-shadow:none;
      }

      .header{
        padding:12px 18px 10px;
      }

      .panel{
        padding:0 16px 18px;
      }

      .box-wrap{
        top:140px;
        width:195px;
      }

      .stage-question{
        top:28px;
      }

      .controls{
        margin-top:12px;
      }

      .control-btn{
        min-height:52px;
      }

      .result-paper{
        top:20px;
        min-height:555px;
      }

      .paper-fortune-message{
        font-size:18px;
      }

      .paper-spot-message{
        font-size:14px;
      }

      .paper-title{
        font-size:50px;
      }

      .paper-fortune-message{
        font-size:15px;
      }

      .paper-spot-name{
        width:10em;
        min-width:10em;
        max-width:10em;
        min-height:3.4em;
        margin:20px auto 24px;
        font-size:24px;
        line-height:1.5;
      }

      .paper-again-btn{
        width:88%;
        min-height:38px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *, *::before, *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }

    @font-face {
      font-family: "Kaisei Opti";
      src: url("./fonts/KaiseiOpti-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Kaisei Opti";
      src: url("./fonts/KaiseiOpti-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: "Kaisei Opti";
      src: url("./fonts/KaiseiOpti-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">秋のイベントガイド 連動コンテンツ</p>
      <h1>秋のおでかけみくじ</h1>
      <p class="lead">おでかけ先に迷ったら、おみくじを引いてみよう！</p>
    </header>

    <section class="panel">
      <div id="fortuneStage" class="fortune-stage">
        <img class="autumn-deco autumn-deco-top"
             src="./images/Autumn_illust_fallen_leaves01.png"
             alt="" aria-hidden="true">
        <img class="autumn-deco autumn-deco-bottom"
             src="./images/Autumn_illust_fallen_leaves02.png"
             alt="" aria-hidden="true">
        <p class="stage-question">今日はどこへ行こう？</p>

        <div
          id="boxWrap"
          class="box-wrap"
          role="button"
          tabindex="0"
          aria-label="おみくじをひく"
        >
          <img class="omikuji-box-image" src="./images/omikuji-box-placeholder.svg" alt="おみくじ箱">
        </div>

        <div id="omikujiStick" class="omikuji-stick" aria-hidden="true"></div>

        <article id="resultPaper" class="result-paper" aria-live="polite">
          <!-- 1. おみくじ結果の説明 -->
          <p id="fortuneText" class="paper-fortune-message">好奇心の赴く先に発見あり。</p>

          <!-- 2. 開運おみくじ -->
          <p class="paper-kicker">開運おみくじ</p>

          <!-- 3. おみくじの結果 -->
          <h2 id="fortuneName" class="paper-title">吉</h2>

          <div class="paper-divider" aria-hidden="true"></div>

          <!-- 4. 施設のおみくじ風の説明 -->
          <p id="spotMessage" class="paper-spot-message">新しい出会いが待っています。</p>

          <!-- 5-6. おすすめ施設 + Map番号 -->
          <div class="paper-facility-head">
            <p class="paper-badge">おでかけ先に迷ったら</p>
            <a id="mapNumber" class="paper-map-number" href="https://www.google.com/maps/search/?api=1&query=%E9%AB%98%E5%B2%A1%E9%A7%85" target="_blank" rel="noopener noreferrer">Map 01</a>
          </div>

          <!-- 7. 施設名 -->
          <p id="spotName" class="paper-spot-name">掲載施設 01</p>

          <!-- 8-9. 施設リンク -->
          <div class="paper-links" aria-label="施設リンク">
            <a id="websiteBtn" class="paper-link website" href="https://www.ypn.co.jp/" target="_blank" rel="noopener noreferrer">公式サイトを見る</a>
            <a id="mapBtn" class="paper-link map" href="https://www.google.com/maps/search/?api=1&query=%E9%AB%98%E5%B2%A1%E9%A7%85" target="_blank" rel="noopener noreferrer">Googleマップで見る</a>
          </div>

          <!-- 10. もう一度ひく -->
          <button id="againBtn" class="paper-again-btn" type="button">もう一度ひく</button>
        </article>

        <div id="confetti" class="confetti" aria-hidden="true"></div>
      </div>
</section>

    <footer class="footer">
      秋のイベントガイド2026<br>
      企画・制作 <a href="https://www.ypn.co.jp/">読売Palette中日本</a>
    </footer>
  </main>

  <script>
    /*
      編集する場所
      1) DESTINATIONS: 施設名 / 施設ごとの一文 / 公式サイトURL / GoogleマップURL
      2) FORTUNE_MESSAGES: 大吉・中吉・吉・小吉ごとの一文
    */

const DESTINATIONS = [
  { id: 1, name: "入善コスモホール", message: "心惹かれる音楽に<br>めぐり逢う日", website: "https://www.town.nyuzen.toyama.jp/gyosei/cosmo/index.html", mapUrl: "https://www.google.com/maps/search/?api=1&query=入善コスモホール" },

  { id: 10, name: "石川県七尾美術館", message: "七尾が生んだ<br>巨匠の歩みに発見あり", website: "https://nanao-art-museum.jp/", mapUrl: "https://www.google.com/maps/search/?api=1&query=石川県七尾美術館" },

  { id: 11, name: "ミュゼふくおか<br>カメラ館", message: "何気ない一日が<br>特別な記念日になる", website: "https://www.camerakan.com/", mapUrl: "https://www.google.com/maps/search/?api=1&query=ミュゼふくおかカメラ館" },

  { id: 12, name: "石川県立音楽堂", message: "受け継がれる<br>日本の美に福あり", website: "https://ongakudo.jp/", mapUrl: "https://www.google.com/maps/search/?api=1&query=石川県立音楽堂" },

  { id: 13, name: "富山市<br>ファミリーパーク", message: "動物とのふれあいが<br>笑顔と福を呼ぶ", website: "https://www.toyama-familypark.jp/", mapUrl: "https://www.google.com/maps/search/?api=1&query=富山市ファミリーパーク" },

  { id: 14, name: "オーバード・ホール<br>中ホール", message: "多彩な表現に<br>心躍るひとときあり", website: "https://www.aubade.or.jp/", mapUrl: "https://www.google.com/maps/search/?api=1&query=オーバード・ホール 中ホール" },

  { id: 15, name: "国立工芸館", message: "好きなもように<br>心わくわく", website: "https://www.momat.go.jp/craft-museum/", mapUrl: "https://www.google.com/maps/search/?api=1&query=国立工芸館" },

];

const FORTUNE_MESSAGES = {
  "大吉": "感性が冴える一日。",
  "吉": "好奇心の赴く先に発見あり。",
  "中吉": "心が動く出来事に恵まれる日。",
  "小吉": "いつもと違う景色に福あり。"
};

const FORTUNES = ["大吉", "吉", "中吉", "小吉"];

    const fortuneStage = document.getElementById("fortuneStage");
    const boxWrap = document.getElementById("boxWrap");
    const omikujiStick = document.getElementById("omikujiStick");
    const resultPaper = document.getElementById("resultPaper");
    const fortuneName = document.getElementById("fortuneName");
    const fortuneText = document.getElementById("fortuneText");
    const spotName = document.getElementById("spotName");
    const spotMessage = document.getElementById("spotMessage");
    const mapNumber = document.getElementById("mapNumber");
    const againBtn = document.getElementById("againBtn");
    const websiteBtn = document.getElementById("websiteBtn");
    const mapBtn = document.getElementById("mapBtn");
    const confetti = document.getElementById("confetti");

    let playing = false;

    function randomItem(array){
      return array[Math.floor(Math.random() * array.length)];
    }

    function setResult(destination, fortune){
      fortuneName.textContent = fortune;
      fortuneText.textContent = FORTUNE_MESSAGES[fortune] || "";
      spotName.innerHTML = destination.name;
      spotMessage.innerHTML = destination.message || "";
      mapNumber.textContent = "Map " + String(destination.id).padStart(2, "0");

      const hasWebsite = destination.website && destination.website !== "#";
      websiteBtn.href = hasWebsite ? destination.website : "#";
      websiteBtn.classList.toggle("is-disabled", !hasWebsite);
      websiteBtn.setAttribute("aria-disabled", hasWebsite ? "false" : "true");

      // GoogleマップURLは DESTINATIONS の mapUrl だけを編集すればよい。
      // 「Map 00」と「Googleマップで見る」は同じURLを使う。
      const googleMapUrl = destination.mapUrl || "https://www.google.com/maps/search/?api=1&query=%E9%AB%98%E5%B2%A1%E9%A7%85";
      mapBtn.href = googleMapUrl;
      mapNumber.href = googleMapUrl;
    }

    function resetAnimation(){
      fortuneStage.classList.remove("is-result");
      boxWrap.classList.remove("shaking");
      omikujiStick.classList.remove("show");
      resultPaper.classList.remove("show");
      confetti.innerHTML = "";
      void boxWrap.offsetWidth;
    }

    function playConfetti(){
      const colors = ["#ef4444", "#f97316", "#facc15", "#84cc16", "#f472b6"];
      confetti.innerHTML = "";

      for(let i = 0; i < 20; i++){
        const piece = document.createElement("span");
        piece.className = "piece";
        piece.style.background = colors[i % colors.length];
        piece.style.left = (45 + Math.random() * 10) + "%";
        piece.style.top = (42 + Math.random() * 8) + "%";
        piece.style.setProperty("--dx", (Math.random() * 260 - 130) + "px");
        piece.style.setProperty("--dy", (Math.random() * 190 - 55) + "px");
        piece.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
        confetti.appendChild(piece);
        requestAnimationFrame(() => piece.classList.add("play"));
      }

      setTimeout(() => { confetti.innerHTML = ""; }, 1200);
    }

    function playOmikuji(){
      if(playing) return;

      playing = true;
      againBtn.disabled = true;
      boxWrap.setAttribute("aria-disabled", "true");

      resetAnimation();

      const destination = randomItem(DESTINATIONS);
      const fortune = randomItem(FORTUNES);
      setResult(destination, fortune);

      boxWrap.classList.add("shaking");

      setTimeout(() => {
        omikujiStick.classList.add("show");
      }, 520);

      setTimeout(() => {
        fortuneStage.classList.add("is-result");
        resultPaper.classList.add("show");
      }, 1050);

      setTimeout(() => {
        playConfetti();
      }, 1450);

      setTimeout(() => {
        againBtn.disabled = false;
        boxWrap.setAttribute("aria-disabled", "false");
        playing = false;
      }, 1650);
    }

    // 初回は「おみくじ箱の画像」をクリック / タップして引く。
    boxWrap.addEventListener("click", playOmikuji);

    // キーボード操作にも対応（Enter / Space）。
    boxWrap.addEventListener("keydown", (event) => {
      if(event.key === "Enter" || event.key === " "){
        event.preventDefault();
        playOmikuji();
      }
    });

    // 結果表示後は「もう一度ひく」で再抽選。
    againBtn.addEventListener("click", playOmikuji);
  </script>
</body>
</html>
