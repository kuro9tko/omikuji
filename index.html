<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf4">
  <title>秋のイベントガイド2026</title>
  <style>
    :root{
      --paper:#fffdf8;
      --ink:#2d211b;
      --muted:#826e62;
      --red:#d52f24;
      --orange:#f97316;
      --line:#ecd4b1;
      --stage-h:690px;
      --control-gap:12px;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
      background:#f4f1ed;
      color:var(--ink);
      font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
    }

    body{
      padding:20px 14px 32px;
    }

    button, a{ font:inherit; }

    .app{
      width:min(100%, 540px);
      margin:0 auto;
      background:#fff;
      box-shadow:0 12px 32px rgba(0,0,0,.08);
    }

    .header{
      padding:28px 24px 22px;
      text-align:center;
    }

    .eyebrow{
      margin:0;
      font-size:13px;
      font-weight:700;
    }

    h1{
      margin:18px 0 12px;
      font-size:clamp(32px, 8vw, 46px);
      line-height:1.2;
      font-weight:800;
      letter-spacing:.02em;
    }

    .lead{
      margin:0;
      font-size:15px;
      line-height:1.8;
    }

    .panel{
      padding:0 22px 26px;
    }

    /* 見た目部分はこのステージの高さを固定して、ボタン位置を安定させる */
    .fortune-stage{
      position:relative;
      width:100%;
      height:var(--stage-h);
      overflow:hidden;
      background:linear-gradient(180deg, #fff 0%, #fffaf2 100%);
      border-top:1px solid #f7ede1;
      border-bottom:1px solid #f4dfc5;
    }

    .stage-question{
      position:absolute;
      top:48px;
      left:0;
      width:100%;
      margin:0;
      text-align:center;
      font-size:18px;
      font-weight:700;
      line-height:1.6;
      transition:opacity .25s ease;
    }

    /* 箱は後で画像差し替え予定。
       サイズ・位置・角度・アニメーションはCSS側だけで管理する。 */
    .box-wrap{
      position:absolute;
      left:50%;
      top:185px;
      width:min(54vw, 230px);
      transform:translateX(-50%) rotate(27deg);
      transform-origin:center;
      z-index:2;
      transition:opacity .25s ease;
    }

    .omikuji-box-image{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
      filter:drop-shadow(0 18px 16px rgba(83,55,24,.18));
    }

    .box-wrap.shaking{
      animation:shakeVertical .42s ease-in-out 4;
    }

    @keyframes shakeVertical{
      0%,100%{ transform:translateX(-50%) rotate(27deg) translateY(0); }
      25%{ transform:translateX(-50%) rotate(27deg) translateY(-14px); }
      50%{ transform:translateX(-50%) rotate(27deg) translateY(12px); }
      75%{ transform:translateX(-50%) rotate(27deg) translateY(-9px); }
    }

    .omikuji-stick{
      position:absolute;
      left:50%;
      top:365px;
      width:13px;
      height:168px;
      border-radius:999px;
      background:linear-gradient(180deg, #fff7e8, #e8c98f);
      box-shadow:0 6px 12px rgba(83,55,24,.15);
      transform:translateX(-50%) translateY(70px);
      opacity:0;
      z-index:1;
    }

    .omikuji-stick.show{
      animation:stickOut .48s ease-out forwards;
    }

    @keyframes stickOut{
      from{ opacity:0; transform:translateX(-50%) translateY(70px); }
      to{ opacity:1; transform:translateX(-50%) translateY(0); }
    }

    .result-paper{
      position:absolute;
      left:50%;
      top:28px;
      width:min(82%, 310px);
      min-height:625px;
      padding:24px 18px 22px;
      transform:translateX(-50%) scale(.92);
      opacity:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 18% 10%, rgba(223,45,32,.05), transparent 18%),
        linear-gradient(180deg, #fffdf8, #fbf2df);
      border:2px solid #ead0a5;
      box-shadow:0 10px 24px rgba(88,55,22,.14);
      z-index:4;
      overflow:hidden;
    }

    .result-paper::before{
      content:"";
      position:absolute;
      inset:9px;
      border:4px solid var(--red);
      pointer-events:none;
    }

    .result-paper::after{
      content:"開運";
      pointer-events:none;
      position:absolute;
      right:20px;
      bottom:22px;
      padding:6px 3px;
      writing-mode:vertical-rl;
      border:3px solid var(--red);
      color:var(--red);
      font-size:20px;
      font-weight:900;
      line-height:1;
    }

    .result-paper.show{
      animation:paperReveal .48s ease-out forwards;
      pointer-events:auto;
    }

    @keyframes paperReveal{
      from{ opacity:0; transform:translateX(-50%) scale(.92); }
      to{ opacity:1; transform:translateX(-50%) scale(1); }
    }
    .paper-kicker{
      width:auto;
      margin:0 auto 8px;
      padding:0;
      border-radius:0;
      color:var(--red);
      background:transparent;
      text-align:center;
      font-size:13px;
      font-weight:900;
      letter-spacing:.16em;
    }

    .paper-title{
      margin:0;
      text-align:center;
      color:var(--red);
      font-size:clamp(70px, 19vw, 96px);
      line-height:1.05;
      font-weight:900;
      letter-spacing:.06em;
    }

    .paper-fortune-message{
      max-width:10em;
      margin:16px auto 0;
      padding-top:18px;
      border-top:3px solid var(--red);
      text-align:center;
      font-size:21px;
      line-height:1.7;
      font-weight:700;
    }

    .paper-divider{
      height:3px;
      margin:16px 0 13px;
      background:linear-gradient(90deg, transparent, var(--red) 10%, var(--red) 90%, transparent);
    }
    .paper-facility-head{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin:0 auto 3px;
    }

    .paper-badge{
      width:auto;
      margin:0;
      padding:0;
      border-radius:0;
      color:var(--red);
      background:transparent;
      font-size:16px;
      font-weight:900;
      letter-spacing:.04em;
    }
    .paper-spot-name{
      margin:4px 0 0;
      text-align:center;
      color:#bd281f;
      font-size:clamp(24px, 6.8vw, 34px);
      line-height:1.3;
      font-weight:900;
    }
    .paper-spot-message{
      max-width:13em;
      margin:0 auto 12px;
      text-align:center;
      font-size:16px;
      line-height:1.7;
      font-weight:700;
    }
    .paper-map-number{
      display:flex;
      align-items:center;
      justify-content:center;
      width:48px;
      height:48px;
      flex:0 0 48px;
      margin:0;
      border-radius:50%;
      background:var(--red);
      color:#fff;
      text-align:center;
      font-size:9px;
      line-height:1;
      font-weight:900;
      letter-spacing:.04em;
      box-shadow:0 3px 8px rgba(189,40,31,.18);
    }

    .fortune-stage.is-result .stage-question,
    .fortune-stage.is-result .box-wrap,
    .fortune-stage.is-result .omikuji-stick{
      opacity:0;
    }

    /* ボタンはstageとは別ブロックで固定。ここで余白を一元管理する */
    .controls{
      display:grid;
      grid-template-columns:1fr;
      gap:var(--control-gap);
      width:100%;
      margin:18px 0 0;
      padding:0;
    }

    .control-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      min-height:58px;
      margin:0;
      padding:12px 18px;
      border-radius:999px;
      font-weight:900;
      cursor:pointer;
    }

    .primary{
      border:0;
      color:#fff;
      background:linear-gradient(90deg, #ff7418, #f74348);
      box-shadow:0 10px 22px rgba(239,68,68,.2);
    }

    .secondary{
      border:2px solid #f2bd87;
      color:#b85b17;
      background:#fff;
    }

    .control-btn:disabled{
      opacity:.55;
      cursor:default;
    }

    /* 施設リンクは結果のおみくじ紙の中、施設名の直下に配置する */
    .paper-links{
      position:relative;
      z-index:6;
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:6px;
      width:100%;
      margin:7px auto 0;
      padding:0 8px;
    }
    .paper-link{
      position:relative;
      z-index:7;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:34px;
      padding:6px 8px;
      border-radius:999px;
      border:1px solid #d8b06e;
      text-decoration:none;
      font-size:11px;
      font-weight:900;
      line-height:1.2;
      transition:transform .15s ease, opacity .15s ease;
    }

    .paper-link.website{
      color:#fff;
      border-color:#d56a21;
      background:#e97a2a;
    }

    .paper-link.map{
      color:#29683b;
      border-color:#8ab895;
      background:#f7fff8;
    }

    .paper-link:active{ transform:scale(.985); }
    .paper-link.is-disabled{ opacity:.4; pointer-events:none; }

    .footer{
      margin-top:20px;
      padding:18px 20px 24px;
      border-top:1px solid var(--line);
      text-align:center;
      color:var(--muted);
      font-size:11px;
      line-height:1.7;
    }

    .confetti{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:8;
    }

    .piece{
      position:absolute;
      width:10px;
      height:14px;
      opacity:0;
      border-radius:3px;
    }

    .piece.play{ animation:burst 1s ease-out forwards; }

    @keyframes burst{
      0%{ opacity:1; transform:translate(0,0) rotate(0deg); }
      100%{ opacity:0; transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); }
    }

    @media (max-width:420px){
      :root{ --stage-h:670px; }
      body{ padding:0; }
      .app{ width:100%; box-shadow:none; }
      .header{ padding:24px 18px 18px; }
      .panel{ padding:0 16px 22px; }
      .box-wrap{ top:180px; width:205px; }
      .result-paper{ top:24px; min-height:605px; }
      .paper-fortune-message{ font-size:19px; }
      .paper-spot-message{ font-size:15px; }
    }

    @media (prefers-reduced-motion:reduce){
      *, *::before, *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">秋のイベントガイド 連動コンテンツ</p>
      <h1>この秋、どこ行く？ おでかけおみくじ</h1>
      <p class="lead">おみくじを引いて、おすすめのイベントを見つけよう！</p>
    </header>

    <section class="panel">
      <div id="fortuneStage" class="fortune-stage">
        <p class="stage-question">どのイベントに行こう？</p>

        <div id="boxWrap" class="box-wrap" aria-hidden="true">
          <img class="omikuji-box-image" src="./omikuji-box-placeholder.svg" alt="">
        </div>

        <div id="omikujiStick" class="omikuji-stick" aria-hidden="true"></div>

        <article id="resultPaper" class="result-paper" aria-live="polite">
          <p class="paper-kicker">開運おみくじ</p>
          <h2 id="fortuneName" class="paper-title">吉</h2>
          <p id="fortuneText" class="paper-fortune-message">好奇心の赴く先に発見あり。</p>
          <div class="paper-divider" aria-hidden="true"></div>

          <p id="spotMessage" class="paper-spot-message">新しい出会いが待っています。</p>

          <div class="paper-facility-head">
            <p class="paper-badge">おすすめ施設</p>
            <p id="mapNumber" class="paper-map-number">Map 01</p>
          </div>

          <p id="spotName" class="paper-spot-name">掲載施設 01</p>

          <div class="paper-links" aria-label="施設リンク">
            <a id="websiteBtn" class="paper-link website" href="https://www.ypn.co.jp/" target="_blank" rel="noopener noreferrer">公式サイトを見る</a>
            <a id="mapBtn" class="paper-link map" href="https://www.google.com/maps/search/?api=1&query=%E9%AB%98%E5%B2%A1%E9%A7%85" target="_blank" rel="noopener noreferrer">Googleマップで見る</a>
          </div>
        </article>

        <div id="confetti" class="confetti" aria-hidden="true"></div>
      </div>

      <div class="controls">
        <button id="drawBtn" class="control-btn primary" type="button">おみくじをひく</button>
        <button id="againBtn" class="control-btn secondary" type="button">もう一度ひく</button>
      </div>
    </section>

    <footer class="footer">
      秋のイベントガイド2026<br>
      ※イベント情報・URLは順次更新します。
    </footer>
  </main>

const FORTUNE_MESSAGES = {
  "大吉": "感性が冴える一日。",
  "中吉": "心が動く出会いに恵まれる日。",
  "吉": "好奇心の赴く先に発見あり。",
  "小吉": "いつもと違う景色に福あり。"
};

const FORTUNES = ["大吉", "中吉", "吉", "小吉"];

    const fortuneStage = document.getElementById("fortuneStage");
    const boxWrap = document.getElementById("boxWrap");
    const omikujiStick = document.getElementById("omikujiStick");
    const resultPaper = document.getElementById("resultPaper");
    const fortuneName = document.getElementById("fortuneName");
    const fortuneText = document.getElementById("fortuneText");
    const spotName = document.getElementById("spotName");
    const spotMessage = document.getElementById("spotMessage");
    const mapNumber = document.getElementById("mapNumber");
    const drawBtn = document.getElementById("drawBtn");
    const againBtn = document.getElementById("againBtn");
    const websiteBtn = document.getElementById("websiteBtn");
    const mapBtn = document.getElementById("mapBtn");
    const confetti = document.getElementById("confetti");

    let playing = false;

    function randomItem(array){
      return array[Math.floor(Math.random() * array.length)];
    }

    function setResult(destination, fortune){
      fortuneName.textContent = fortune;
      fortuneText.textContent = FORTUNE_MESSAGES[fortune] || "";
      spotName.textContent = destination.name;
      spotMessage.textContent = destination.message || "";
      mapNumber.textContent = "Map " + String(destination.id).padStart(2, "0");

      const hasWebsite = destination.website && destination.website !== "#";
      websiteBtn.href = hasWebsite ? destination.website : "#";
      websiteBtn.classList.toggle("is-disabled", !hasWebsite);
      websiteBtn.setAttribute("aria-disabled", hasWebsite ? "false" : "true");

      mapBtn.href = destination.mapUrl || "https://www.google.com/maps/search/?api=1&query=%E9%AB%98%E5%B2%A1%E9%A7%85";
    }

    function resetAnimation(){
      fortuneStage.classList.remove("is-result");
      boxWrap.classList.remove("shaking");
      omikujiStick.classList.remove("show");
      resultPaper.classList.remove("show");
      confetti.innerHTML = "";
      void boxWrap.offsetWidth;
    }

    function playConfetti(){
      const colors = ["#ef4444", "#f97316", "#facc15", "#84cc16", "#f472b6"];
      confetti.innerHTML = "";

      for(let i = 0; i < 20; i++){
        const piece = document.createElement("span");
        piece.className = "piece";
        piece.style.background = colors[i % colors.length];
        piece.style.left = (45 + Math.random() * 10) + "%";
        piece.style.top = (42 + Math.random() * 8) + "%";
        piece.style.setProperty("--dx", (Math.random() * 260 - 130) + "px");
        piece.style.setProperty("--dy", (Math.random() * 190 - 55) + "px");
        piece.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
        confetti.appendChild(piece);
        requestAnimationFrame(() => piece.classList.add("play"));
      }

      setTimeout(() => { confetti.innerHTML = ""; }, 1200);
    }

    function playOmikuji(){
      if(playing) return;

      playing = true;
      drawBtn.disabled = true;
      againBtn.disabled = true;

      resetAnimation();

      const destination = randomItem(DESTINATIONS);
      const fortune = randomItem(FORTUNES);
      setResult(destination, fortune);

      boxWrap.classList.add("shaking");

      setTimeout(() => {
        omikujiStick.classList.add("show");
      }, 520);

      setTimeout(() => {
        fortuneStage.classList.add("is-result");
        resultPaper.classList.add("show");
      }, 1050);

      setTimeout(() => {
        playConfetti();
      }, 1450);

      setTimeout(() => {
        drawBtn.disabled = false;
        againBtn.disabled = false;
        playing = false;
      }, 1650);
    }

    drawBtn.addEventListener("click", playOmikuji);
    againBtn.addEventListener("click", playOmikuji);
  </script>
